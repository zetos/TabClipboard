<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'none'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="description" content="Legal information for the TabClipboard Chrome extension.">
    <title>TabClipboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell landing">
      <header class="hero">
        <span class="monogram" aria-hidden="true">TC</span>
        <div>
          <p class="eyebrow">TabClipboard / Legal</p>
          <h1>Tabs to text.<br>Text to tabs.</h1>
        </div>
      </header>

      <p class="lede">
        Legal information for the open-source TabClipboard Chrome extension.
      </p>

      <nav class="document-links" aria-label="Legal documents">
        <a class="document-link" href="privacy/">
          <span class="item-number" aria-hidden="true">01</span>
          <span>
            <strong>Privacy policy</strong>
            <small>How TabClipboard handles browser and clipboard data</small>
          </span>
          <span aria-hidden="true">-&gt;</span>
        </a>
        <a
          class="document-link"
          href="https://github.com/zetos/TabClipboard/blob/main/LICENSE"
          rel="noreferrer"
        >
          <span class="item-number" aria-hidden="true">02</span>
          <span>
            <strong>MIT license</strong>
            <small>Terms for using and distributing the source code</small>
          </span>
          <span aria-hidden="true">-&gt;</span>
        </a>
      </nav>

      <footer>
        <a href="https://github.com/zetos/TabClipboard" rel="noreferrer">Source on GitHub</a>
      </footer>
    </main>
  </body>
</html>
