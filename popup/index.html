<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>TabClipboard</title>
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <span class="monogram" aria-hidden="true">TC</span>
        <div>
          <p class="eyebrow">TabClipboard</p>
          <h1>Make haste slowly.</h1>
        </div>
      </header>

      <p id="action-help" class="summary">
        Copy every open HTTP(S) tab URL, or open each valid link in the clipboard as a tab.
      </p>

      <section class="actions" aria-label="Link actions" aria-describedby="action-help">
        <button id="copy-tab-links" class="action" type="button">
          <span class="action-index" aria-hidden="true">01</span>
          <span class="action-copy">
            <strong>Copy open tabs</strong>
            <small>All web links, one per line</small>
          </span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 8V5.75A1.75 1.75 0 0 1 9.75 4h8.5A1.75 1.75 0 0 1 20 5.75v8.5A1.75 1.75 0 0 1 18.25 16H16m-10.25-8h8.5A1.75 1.75 0 0 1 16 9.75v8.5A1.75 1.75 0 0 1 14.25 20h-8.5A1.75 1.75 0 0 1 4 18.25v-8.5A1.75 1.75 0 0 1 5.75 8Z"/>
          </svg>
        </button>

        <button id="open-clipboard-links" class="action" type="button">
          <span class="action-index" aria-hidden="true">02</span>
          <span class="action-copy">
            <strong>Open clipboard links</strong>
            <small>Valid lines become background tabs</small>
          </span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M13 5h6v6m0-6-9 9m7 1v3.25A1.75 1.75 0 0 1 15.25 20h-9.5A1.75 1.75 0 0 1 4 18.25v-9.5A1.75 1.75 0 0 1 5.75 7H9"/>
          </svg>
        </button>
      </section>

      <footer id="runtime-status" data-state="ready" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-message">Ready</span>
      </footer>
    </main>
    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
